name: Instaladores

# Se lanza a mano (pestaña Actions › Instaladores › Run workflow) o al publicar
# una etiqueta `v1.2.3`. Cada sistema se construye en su propia máquina: un .dmg
# solo sale de un Mac y el instalador de Windows solo de Windows.
on:
  workflow_dispatch:
    inputs:
      solo:
        description: Qué sistema construir
        type: choice
        default: windows
        options: [windows, macos, linux, todos]
  push:
    tags: ['v*']

jobs:
  # En un repositorio privado un minuto de macOS cuenta como diez y uno de
  # Windows como dos, así que la matriz se decide antes de encender nada.
  preparar:
    name: Decidir qué se construye
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.elegir.outputs.matriz }}
    steps:
      - id: elegir
        shell: bash
        env:
          SOLO: ${{ inputs.solo }}
        run: |
          todos='[
            {"clave":"windows","os":"windows-latest","nombre":"Windows (.exe)","comando":"dist:win"},
            {"clave":"macos","os":"macos-latest","nombre":"macOS (.dmg)","comando":"dist:mac"},
            {"clave":"linux","os":"ubuntu-latest","nombre":"Linux (AppImage y .deb)","comando":"dist:linux"}
          ]'
          if [ -z "$SOLO" ] || [ "$SOLO" = "todos" ]; then
            elegida=$(echo "$todos" | jq -c .)
          else
            elegida=$(echo "$todos" | jq -c --arg s "$SOLO" '[.[] | select(.clave == $s)]')
          fi
          echo "matriz=$elegida" >> "$GITHUB_OUTPUT"
          echo "Se construirá: $elegida"

  construir:
    name: ${{ matrix.nombre }}
    needs: preparar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.comando }}
        env:
          # Sin certificado no hay nada que descubrir: que no lo intente.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Un solo paquete con todo obliga a descargar 450 MB para usar 95. Se
      # separa lo que se instala de lo que se ejecuta tal cual.
      - name: Instalador de Windows
        if: matrix.clave == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-windows-instalador
          retention-days: 30
          if-no-files-found: error
          path: release/*Setup*.exe

      - name: Windows sin instalar
        if: matrix.clave == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-windows-sin-instalar
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.exe
            !release/*Setup*.exe
            release/*.zip

      - name: Paquete de macOS
        if: matrix.clave == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-macos
          retention-days: 30
          if-no-files-found: error
          path: release/*.dmg

      - name: Paquetes de Linux
        if: matrix.clave == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-linux
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb

  # Una etiqueta `v1.2.3` publica los instaladores como archivos sueltos, que es
  # como se descargan de uno en uno en vez de dentro de un zip de zips.
  publicar:
    name: Publicar la versión
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pletina $GITHUB_REF_NAME" \
            --generate-notes \
            $(find paquetes -type f | sort)

name: Instaladores

# Se lanza a mano (pestaña Actions › Instaladores › Run workflow) o al publicar
# una etiqueta `v1.2.3`. Cada sistema se construye en su propia máquina: un .dmg
# solo sale de un Mac y el instalador de Windows solo de Windows.
on:
  workflow_dispatch:
    inputs:
      solo:
        description: Qué sistema construir
        type: choice
        default: windows
        options: [windows, macos, linux, todos]
      publicar:
        description: Publicar también en la página de versiones
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  # En un repositorio privado un minuto de macOS cuenta como diez y uno de
  # Windows como dos, así que la matriz se decide antes de encender nada.
  preparar:
    name: Decidir qué se construye
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.elegir.outputs.matriz }}
    steps:
      - id: elegir
        shell: bash
        env:
          SOLO: ${{ inputs.solo }}
        run: |
          todos='[
            {"clave":"windows","os":"windows-latest","nombre":"Windows (.exe)","comando":"dist:win"},
            {"clave":"macos","os":"macos-latest","nombre":"macOS (.dmg)","comando":"dist:mac"},
            {"clave":"linux","os":"ubuntu-latest","nombre":"Linux (AppImage y .deb)","comando":"dist:linux"}
          ]'
          if [ -z "$SOLO" ] || [ "$SOLO" = "todos" ]; then
            elegida=$(echo "$todos" | jq -c .)
          else
            elegida=$(echo "$todos" | jq -c --arg s "$SOLO" '[.[] | select(.clave == $s)]')
          fi
          echo "matriz=$elegida" >> "$GITHUB_OUTPUT"
          echo "Se construirá: $elegida"

  construir:
    name: ${{ matrix.nombre }}
    needs: preparar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.comando }}
        env:
          # Sin certificado no hay nada que descubrir: que no lo intente.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Un solo paquete con todo obliga a descargar 450 MB para usar 95. Se
      # separa lo que se instala de lo que se ejecuta tal cual.
      - name: Instalador de Windows
        if: matrix.clave == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-windows-instalador
          retention-days: 30
          if-no-files-found: error
          path: release/*Setup*.exe

      - name: Windows sin instalar
        if: matrix.clave == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-windows-sin-instalar
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.exe
            !release/*Setup*.exe
            release/*.zip

      - name: Paquete de macOS
        if: matrix.clave == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-macos
          retention-days: 30
          if-no-files-found: error
          path: release/*.dmg

      - name: Paquetes de Linux
        if: matrix.clave == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pletina-linux
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb

  # Los artefactos de una ejecución son un zip de zips y piden estar
  # identificado. La página de versiones da el archivo suelto, con enlace
  # directo y permanente: es de donde se descarga esto de verdad.
  publicar:
    name: Publicar la versión
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
      # Desde una etiqueta, la etiqueta manda; a mano, la versión del package.json.
      - id: version
        run: echo "etiqueta=${GITHUB_REF_NAME#refs/tags/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: fuente
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="${{ steps.version.outputs.etiqueta }}"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            etiqueta="v$(node -p "require('./fuente/package.json').version")"
          fi
          archivos=$(find paquetes -type f | sort)
          echo "Publicando $etiqueta con:"; echo "$archivos"
          if gh release view "$etiqueta" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$etiqueta" $archivos --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$etiqueta" $archivos \
              --repo "$GITHUB_REPOSITORY" \
              --title "Pletina $etiqueta" \
              --notes-file fuente/CHANGELOG.md
          fi
